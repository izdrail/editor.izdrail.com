[package]
name = "lapce-ai"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = { version = "=0.4.3", default-features = false, features = ["ureq"] }
sha2 = "0.10"
