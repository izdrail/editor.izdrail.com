name: Linux build

# Main-only tests and release binaries. Artifacts are downloads, not deployments.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Rust workspace acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Install Ubuntu test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential php-cli python3 git curl ca-certificates xz-utils clang pkg-config libxkbcommon-x11-dev libvulkan-dev libwayland-dev xorg-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev cmake
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
      - name: Export changed-file rustfmt review (no source writes)
        run: |
          rustup component add rustfmt --toolchain 1.98.0
          python3 scripts/export-format-review.py
      - name: Upload rustfmt review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-review
          path: target/format-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Cache test dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: hosted-tests-ubuntu-22.04-rust-1.98.0-debug0
      - name: PHP and Composer for framework fixtures
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, sqlite3
          tools: composer:v2
          coverage: none
      - name: Install pinned framework fixture dependencies
        run: |
          mkdir -p scripts/fixtures/laravel/bootstrap/cache scripts/fixtures/laravel/storage/framework/{views,cache,sessions} scripts/fixtures/laravel/storage/logs
          composer install --working-dir=scripts/fixtures/laravel --no-interaction --prefer-dist --no-progress
      - name: Lexer, focused and full workspace tests
        run: bash scripts/test-linux-hosted.sh
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-logs
          path: |
            target/acceptance-logs/
            scripts/fixtures/laravel/composer.lock
          if-no-files-found: warn
          retention-days: 14
  llama-cpp-check:
    name: Optional llama.cpp CPU feature
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake clang libclang-dev libssl-dev pkg-config
      - name: Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update && rustup default 1.98.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: llama-cpp-cpu-rust-1.98.0
      - name: Compile and test optional provider
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          CARGO_BUILD_JOBS: 2
        run: cargo test --locked -p lapce-ai --features llama-cpp

  mistral-worker-check:
    name: Isolated Mistral.rs CPU worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake clang libclang-dev libssl-dev pkg-config protobuf-compiler
      - name: Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update && rustup default 1.98.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: inference/mistral-worker
          key: mistral-worker-cpu-rust-1.98.0
      - name: Compile isolated offline worker
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_DEV_DEBUG: 0
          HF_HUB_OFFLINE: 1
        run: cargo test --locked --manifest-path inference/mistral-worker/Cargo.toml

  linux:
    name: Linux x86_64 release binary
    needs: tests
    if: github.ref == 'refs/heads/main'
    # Standard GitHub-hosted runner, independent of Dell availability.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 git curl ca-certificates xz-utils clang pkg-config libxkbcommon-x11-dev libvulkan-dev libwayland-dev xorg-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev cmake

      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: hosted-ubuntu-22.04-rust-1.98.0

      - name: Packaging regression tests
        run: python3 scripts/test-linux-build.py

      - name: Build and verify Ubuntu 22.04 binaries
        run: bash scripts/build-linux-hosted.sh

      - name: Install synthetic GUI capture dependencies
        run: sudo apt-get install -y -qq xvfb xdotool scrot xclip libgl1-mesa-dri mesa-vulkan-drivers tesseract-ocr python3-pil

      - name: Capture composer keyboard states
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          WGPU_BACKEND: vulkan
        run: python3 scripts/qa/composer-hosted.py target/release/gravity target/gui-acceptance

      - name: Capture delayed chat streaming states
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          WGPU_BACKEND: vulkan
        run: python3 scripts/qa/chat-stream-hosted.py target/release/gravity target/chat-stream-acceptance

      - name: Upload GUI screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-gui-acceptance
          path: |
            target/gui-acceptance/*.png
            target/gui-acceptance/*.log
            target/gui-acceptance/result.txt
            target/chat-stream-acceptance/*.png
            target/chat-stream-acceptance/*.log
            target/chat-stream-acceptance/result.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Package
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=8 HEAD)
          dir="gravity-linux-x86_64-${short}"
          mkdir "$dir"
          cp target/ubuntu-22.04/release/gravity target/ubuntu-22.04/release/lapce-proxy "$dir/"
          strip "$dir"/gravity "$dir"/lapce-proxy
          cp extra/linux/install-desktop.sh extra/images/window-icon.png "$dir/"
          cp extra/images/logo_color.svg "$dir/logo.svg"
          cat > "$dir/README.txt" <<EOT
          Gravity Editor (${GITHUB_REPOSITORY} ${short}), Linux x86_64 release build.
          Run ./gravity. Run ./install-desktop.sh once for the Linux app menu/dock icon.
          lapce-proxy must sit next to it for remote use.
          Runtime libs (Debian/Ubuntu): sudo apt install libxkbcommon-x11-0 libvulkan1 libwayland-client0 libxcb-shape0 libxcb-xfixes0
          EOT
          tar cJf "${dir}.tar.xz" "$dir"
          sha256sum "${dir}.tar.xz" | tee "${dir}.tar.xz.sha256"
          echo "ARTIFACT=${dir}.tar.xz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: gravity-linux-x86_64
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 30
