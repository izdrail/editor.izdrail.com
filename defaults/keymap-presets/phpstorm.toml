# Compatibility subset for existing Lapce commands, not full editor emulation.

[[keymaps]]
key = "ctrl+shift+a"
command = "palette.command"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+shift+n"
command = "palette"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+d"
command = "duplicate_line_down"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+y"
command = "delete_line"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+shift+z"
command = "redo"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+r"
command = "focus_replace_editor"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+g"
command = "palette.line"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+/"
command = "toggle_line_comment"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+s"
command = "save"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+o"
command = "open_file"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+n"
command = "new_file"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+z"
command = "undo"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+c"
command = "clipboard_copy"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+x"
command = "clipboard_cut"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+v"
command = "clipboard_paste"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+a"
command = "select_all"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+f"
command = "search"
mode = "i"
when = "editor_focus && !list_focus"
