# Sublime Text style subset for existing commands, not full emulation.

[[keymaps]]
key = "ctrl+p"
command = "palette"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+shift+p"
command = "palette.command"
mode = "i"
when = "editor_focus && !list_focus"

[[keymaps]]
key = "ctrl+r"
command = "palette.symbol"
mode = "i"
when = "editor_focus && !list_focus"

