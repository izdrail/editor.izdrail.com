[package]
name = "lexilla-rs"
version = "0.1.0"
edition = "2021"
[build-dependencies]
cc = { version = "1", features = ["parallel"] }
[features]
benchmark = ["dep:tree-sitter", "dep:tree-sitter-cpp"]
[dependencies]
tree-sitter = { version = "0.27.1", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }

[[bin]]
name = "ts_bench"
path = "src/bin/ts_bench.rs"
required-features = ["benchmark"]
